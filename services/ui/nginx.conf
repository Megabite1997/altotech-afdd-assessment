server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single origin for the SPA and the API, so the browser never needs CORS.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
