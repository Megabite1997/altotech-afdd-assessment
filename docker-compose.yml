name: altotech-afdd

# Compose auto-loads ./.env for interpolation, so every setting below works with
# or without one. `cp .env.example .env` to change anything; the defaults here
# are the documented ones.
x-platform-image: &platform
  build:
    context: ./services/platform
  environment:
    DATABASE_URL: postgresql://afdd:afdd@timescaledb:5432/afdd
    KAFKA_BOOTSTRAP: redpanda:9092
    SOURCE_DIR: /srv/source-pack
    TELEMETRY_TOPIC: ${TELEMETRY_TOPIC:-telemetry.device.v1}
    CONSUMER_GROUP: ${CONSUMER_GROUP:-afdd-ingest}
    TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-6}
    SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-60}
    SIM_SPEEDUP: ${SIM_SPEEDUP:-60}
    SIM_BUILDINGS: ${SIM_BUILDINGS:-*}
    SIM_LOOP: ${SIM_LOOP:-false}
    EVAL_CLOCK: ${EVAL_CLOCK:-data}
    EVAL_TICK_SECONDS: ${EVAL_TICK_SECONDS:-5}
    LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
    AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-6}
    AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
    API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ./source-pack:/srv/source-pack:ro
  restart: unless-stopped

services:
  # --- stores --------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: afdd
      POSTGRES_PASSWORD: afdd
      POSTGRES_DB: afdd
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afdd -d afdd"]
      interval: 5s
      timeout: 5s
      retries: 40

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports: ["19092:19092", "9644:9644"]
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 40

  # --- one-shot: migrate, load the ontology, install the default rules ------
  seed:
    <<: *platform
    restart: "no"
    command: ["afdd", "seed"]
    depends_on:
      timescaledb: {condition: service_healthy}

  # --- long-running services ------------------------------------------------
  api:
    <<: *platform
    command: ["uvicorn", "afdd.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ingest:
    <<: *platform
    command: ["afdd", "ingest"]
    depends_on:
      seed: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  simulator:
    <<: *platform
    restart: "no"
    command: ["afdd", "simulate"]
    depends_on:
      ingest: {condition: service_started}
      redpanda: {condition: service_healthy}

  evaluator:
    <<: *platform
    command: ["afdd", "evaluate"]
    depends_on:
      seed: {condition: service_completed_successfully}

  ui:
    build:
      context: ./services/ui
    ports: ["3000:80"]
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

volumes:
  timescale-data:
  redpanda-data:
